name: Release

on:
  push:
    tags:
      - "v*.*.*"

run-name: Release ${{ github.ref_name }}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Depending on a past tagged version to extract this project's own
      # release notes would leave a future release unable to fix a
      # regression in the extraction logic itself. Uses the working tree's
      # own action.yml instead.
      - name: Extract changelog section for this version
        id: changelog
        uses: ./
        with:
          ref-name: ${{ github.ref_name }}

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.changelog.outputs.release-notes-path }}
